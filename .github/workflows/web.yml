name: Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            web
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,worker-build
      - name: Shared code builds without the terminal frontend
        run: cargo clippy --lib --no-default-features --target wasm32-unknown-unknown -- -D warnings
      - working-directory: web
        run: |
          cargo fmt --check
          cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings
      - name: Build
        working-directory: web
        run: |
          (cd client && trunk build --release)
          (cd server && worker-build --release)
      # Deploys from main once the Cloudflare secrets are set (see AGENTS.md).
      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: web
        run: npx --yes wrangler@4 deploy
