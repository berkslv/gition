name: CI

# One pipeline for everything:
# - every push and PR: tests on 3 OSes, web lint + build
# - push to main: also checks the install scripts and deploys the web app
# - tag vX.Y.Z: also builds binaries, publishes the GitHub Release and the crate
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml version
        if: env.IS_TAG == 'true'
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - if: env.IS_TAG == 'true' && runner.os == 'Linux'
        run: cargo publish --dry-run --locked

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            web
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,worker-build
      - name: Shared code builds without the terminal frontend
        run: cargo clippy --lib --no-default-features --target wasm32-unknown-unknown -- -D warnings
      - working-directory: web
        run: |
          cargo fmt --check
          cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings
      - name: Build
        working-directory: web
        run: |
          (cd client && trunk build --release)
          (cd server && worker-build --release)
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            web/client/dist
            web/server/build
          include-hidden-files: true

  deploy-web:
    needs: [test, web]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web
      - working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

  # Installs the latest published release with the scripts in this checkout.
  install-scripts:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os != 'Windows'
        run: |
          GITION_INSTALL_DIR="$RUNNER_TEMP/bin" sh scripts/install.sh
          "$RUNNER_TEMP/bin/gition" --version
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:GITION_INSTALL_DIR = "$env:RUNNER_TEMP\bin"
          ./scripts/install.ps1
          & "$env:RUNNER_TEMP\bin\gition.exe" --version

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest, ext: zip }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, ext: zip }
          - { target: x86_64-apple-darwin, os: macos-latest, ext: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-latest, ext: tar.gz }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, ext: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, ext: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=gition-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$name"
          cp README.md LICENSE "$name/"
          if [ "${{ matrix.ext }}" = zip ]; then
            cp target/${{ matrix.target }}/release/gition.exe "$name/"
            7z a "$name.zip" "$name" >/dev/null
          else
            cp target/${{ matrix.target }}/release/gition "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: gition-*.${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-*-*"
          merge-multiple: true
      - name: Checksums
        run: sha256sum gition-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            gition-*
            SHA256SUMS

  # crates.io Trusted Publishing: no stored token.
  crates-io:
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
