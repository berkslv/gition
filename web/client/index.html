<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0f1115" />
    <title>gition</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="0" />
    <link data-trunk rel="copy-file" href=".assetsignore" />
    <link data-trunk rel="copy-file" href="icon.svg" />
    <link data-trunk rel="copy-file" href="apple-touch-icon.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        /* No double-tap or pinch zoom anywhere on the page, not only on the grid. */
        touch-action: none;
        background: #0f1115;
        color: #d8dee9;
        font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
        font-size: 15px;
      }
      body {
        display: flex;
        flex-direction: column;
        /* Updated from visualViewport so the on-screen keyboard doesn't cover the grid. */
        height: 100dvh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
        box-sizing: border-box;
      }
      #term {
        position: relative;
        z-index: 1;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        /* Taps, drags and long presses are gestures for gition, not page scrolling or text selection. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      /* Inline images, under the grid: their cells are transparent. */
      #pics {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      #pics img {
        position: absolute;
        object-fit: contain;
        object-position: left top;
      }
      /* Ratzilla draws each row as a <pre>; drop the browser's margins so rows touch. */
      pre {
        margin: 0;
        font: inherit;
        line-height: normal;
      }
      /* Receives the on-screen keyboard. 16px stops iOS from zooming in on focus. */
      #kbd {
        position: fixed;
        top: 0;
        left: 0;
        width: 1px;
        height: 1px;
        opacity: 0;
        border: 0;
        padding: 0;
        font-size: 16px;
        resize: none;
      }
      @media (max-width: 600px) {
        html,
        body {
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <div id="pics"></div>
    <div id="term"></div>
    <textarea id="kbd" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
  </body>
</html>
