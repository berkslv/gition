<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
    <title>gition</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="0" />
    <link data-trunk rel="copy-file" href=".assetsignore" />
    <link data-trunk rel="copy-file" href="icon.svg" />
    <link data-trunk rel="copy-file" href="apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --side: #f7f7f5;
        --text: #37352f;
        --muted: #787774;
        --faint: #a5a29a;
        --line: #e9e9e7;
        --hover: rgba(55, 53, 47, 0.07);
        --active: rgba(55, 53, 47, 0.12);
        --code: rgba(135, 131, 120, 0.15);
        --accent: #2383e2;
        --accent-text: #ffffff;
        --ok: #448361;
        --warn: #cb912f;
        --danger: #d44c47;
        --h1: var(--text);
        --h2: var(--text);
        --h3: var(--text);
        --link: var(--text);
        --code-text: #c4403b;
        --bullet: var(--text);
        --folder: var(--faint);
        --current: var(--text);
        --quote: currentColor;
        --selection: rgba(35, 131, 226, 0.28);
        --toast: #2f2f2f;
        --shadow: 0 8px 28px rgba(15, 15, 15, 0.14), 0 0 0 1px rgba(15, 15, 15, 0.05);
        --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          /* gition's own terminal colors (the default theme, in the 16 colors the web always used). */
          --bg: #0f1115;
          --side: #151820;
          --text: #d8dee9;
          --muted: #8a92a3;
          --faint: #4c566a;
          --line: #262b35;
          --hover: rgba(216, 222, 233, 0.06);
          --active: rgba(216, 222, 233, 0.1);
          --code: rgba(216, 222, 233, 0.07);
          --accent: #88c0d0;
          --accent-text: #0f1115;
          --ok: #a3be8c;
          --warn: #ebcb8b;
          --danger: #bf616a;
          --h1: #b48ead;
          --h2: #88c0d0;
          --h3: #81a1c1;
          --link: #81a1c1;
          --code-text: #ebcb8b;
          --bullet: #88c0d0;
          --folder: #81a1c1;
          --current: #a3be8c;
          --quote: #767e8e;
          --selection: rgba(0, 95, 135, 0.7);
          --toast: #2e3440;
          --shadow: 0 8px 28px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(216, 222, 233, 0.08);
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        /* gition's own terminal colors (the default theme, in the 16 colors the web always used). */
        --bg: #0f1115;
        --side: #151820;
        --text: #d8dee9;
        --muted: #8a92a3;
        --faint: #4c566a;
        --line: #262b35;
        --hover: rgba(216, 222, 233, 0.06);
        --active: rgba(216, 222, 233, 0.1);
        --code: rgba(216, 222, 233, 0.07);
        --accent: #88c0d0;
        --accent-text: #0f1115;
        --ok: #a3be8c;
        --warn: #ebcb8b;
        --danger: #bf616a;
        --h1: #b48ead;
        --h2: #88c0d0;
        --h3: #81a1c1;
        --link: #81a1c1;
        --code-text: #ebcb8b;
        --bullet: #88c0d0;
        --folder: #81a1c1;
        --current: #a3be8c;
        --quote: #767e8e;
        --selection: rgba(0, 95, 135, 0.7);
        --toast: #2e3440;
        --shadow: 0 8px 28px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(216, 222, 233, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      ::selection {
        background: var(--selection);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 var(--sans);
        -webkit-text-size-adjust: 100%;
      }
      body {
        /* Updated from visualViewport so the on-screen keyboard doesn't cover the page. */
        height: 100dvh;
        overflow: hidden;
      }
      #app {
        height: 100%;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
      }
      button:hover {
        background: var(--hover);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-text);
      }
      button.danger {
        background: var(--danger);
        border-color: var(--danger);
        color: #fff;
      }
      button.wide {
        width: 100%;
        padding: 10px;
      }
      .muted {
        color: var(--muted);
      }
      .pad {
        padding: 6px 12px;
      }
      .error {
        color: var(--danger);
        white-space: pre-wrap;
      }
      .hint {
        color: var(--muted);
        font-size: 13px;
      }
      .btns {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        flex-wrap: wrap;
        margin-top: 16px;
      }

      /* ---- screens before the notebook ---- */
      .center {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .card {
        width: 100%;
        max-width: 420px;
      }
      .card h1 {
        font-size: 28px;
        margin: 0 0 12px;
      }
      .list {
        display: flex;
        flex-direction: column;
        max-height: 50vh;
        overflow-y: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      /* ---- the notebook ---- */
      .nb {
        display: flex;
        height: 100%;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
      }
      #side {
        width: 260px;
        flex: none;
        background: var(--side);
        display: flex;
        flex-direction: column;
        padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
        overflow: hidden;
        transition: margin-left 0.15s ease;
      }
      .nb.side-closed #side {
        margin-left: -260px;
      }
      .side-top {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0 2px 6px;
      }
      .repo {
        flex: 1;
        min-width: 0;
        text-align: left;
        font-weight: 600;
        border: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .side-btn {
        border: 0;
        text-align: left;
        color: var(--muted);
        padding: 4px 10px;
      }
      #tree {
        flex: 1;
        overflow-y: auto;
        padding: 6px 0;
        font-size: 14px;
      }
      .row {
        display: flex;
        align-items: center;
        min-height: 30px;
        padding: 0 4px 0 calc(4px + var(--depth) * 14px);
        border-radius: 5px;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
      }
      .row:hover {
        background: var(--hover);
      }
      .row.cur {
        background: var(--active);
        color: var(--current);
        font-weight: 600;
      }
      .tw {
        width: 20px;
        flex: none;
        text-align: center;
        color: var(--folder);
        font-size: 12px;
      }
      .nm {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tools {
        display: none;
        flex: none;
      }
      .row:hover .tools,
      .row.cur .tools {
        display: flex;
      }
      .ib {
        border: 0;
        border-radius: 4px;
        padding: 0 6px;
        min-width: 26px;
        height: 26px;
        line-height: 26px;
        text-align: center;
        color: var(--muted);
        cursor: pointer;
      }
      .ib:hover {
        background: var(--active);
      }
      #scrim {
        display: none;
      }
      main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 45px;
        flex: none;
        padding: 0 12px;
      }
      .show-side {
        display: none;
      }
      .nb.side-closed .show-side {
        display: block;
      }
      #crumbs {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        overflow: hidden;
        white-space: nowrap;
        font-size: 14px;
      }
      .crumb {
        border: 0;
        padding: 2px 6px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .crumb.here {
        color: var(--text);
      }
      .sep {
        color: var(--faint);
      }
      #note {
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }
      #sync {
        font-size: 14px;
        padding: 3px 10px;
        white-space: nowrap;
      }
      #sync.ok {
        color: var(--muted);
        border-color: transparent;
      }
      #sync.pending {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-text);
      }
      #sync.warn {
        color: var(--warn);
      }
      #sync.busy {
        color: var(--muted);
      }
      #scroll {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      #page {
        max-width: 760px;
        margin: 0 auto;
        padding: 32px 56px calc(30vh + env(safe-area-inset-bottom));
      }

      /* ---- blocks ---- */
      .blk {
        position: relative;
        margin: 2px -8px;
        padding: 3px 8px;
        border-radius: 4px;
        min-height: 1.5em;
        cursor: text;
        overflow-wrap: anywhere;
      }
      .blk:hover:not(.editing) {
        background: var(--hover);
      }
      .blk > :first-child {
        margin-top: 0;
      }
      .blk > :last-child {
        margin-bottom: 0;
      }
      .blk p {
        margin: 0;
      }
      .blk h1,
      #page > h1 {
        font-size: 2em;
        line-height: 1.2;
        margin: 0.6em 0 0.1em;
        color: var(--h1);
      }
      .blk h2 {
        font-size: 1.5em;
        line-height: 1.3;
        margin: 0.8em 0 0.1em;
        color: var(--h2);
      }
      .blk h3,
      .blk h4,
      .blk h5,
      .blk h6 {
        font-size: 1.25em;
        margin: 0.6em 0 0.1em;
        color: var(--h3);
      }
      .blk:first-child h1 {
        margin-top: 0;
      }
      .blk ul,
      .blk ol {
        margin: 0;
        padding-left: 1.6em;
      }
      .blk li::marker {
        color: var(--bullet);
      }
      .blk li:has(> input[type="checkbox"]) {
        list-style: none;
      }
      .blk input[type="checkbox"] {
        margin: 0 0.45em 0 -1.4em;
        width: 1em;
        height: 1em;
        vertical-align: -0.12em;
        accent-color: var(--bullet);
        cursor: pointer;
      }
      .blk li:has(> input:checked) {
        color: var(--muted);
        text-decoration: line-through;
      }
      .blk blockquote {
        margin: 0;
        padding-left: 14px;
        border-left: 3px solid var(--quote);
      }
      .blk pre,
      .blk code {
        font-family: var(--mono);
        font-size: 0.875em;
        background: var(--code);
        color: var(--code-text);
        border-radius: 4px;
      }
      .blk code {
        padding: 0.15em 0.35em;
      }
      .blk pre {
        margin: 0;
        padding: 14px 16px;
        overflow-x: auto;
        white-space: pre;
      }
      .blk pre code {
        background: none;
        color: inherit;
        padding: 0;
        font-size: inherit;
      }
      .blk pre.meta,
      .blk pre.raw {
        color: var(--muted);
        white-space: pre-wrap;
      }
      .blk hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 0.7em 0;
      }
      .blk table {
        border-collapse: collapse;
        display: block;
        overflow-x: auto;
      }
      .blk th,
      .blk td {
        border: 1px solid var(--line);
        padding: 6px 10px;
        text-align: left;
      }
      .blk img {
        display: block;
        max-width: 100%;
        max-height: 70vh;
        border-radius: 4px;
        margin: 4px 0;
      }
      .blk img.missing,
      .file img.missing {
        min-width: 160px;
        min-height: 60px;
        background: var(--code);
      }
      .blk a,
      .children a {
        color: var(--link);
        text-decoration: underline;
        text-decoration-color: var(--faint);
        text-underline-offset: 2px;
        cursor: pointer;
      }
      .blk a[data-page],
      .children a {
        font-weight: 500;
      }
      .blk.editing {
        background: var(--hover);
      }
      textarea.src {
        display: block;
        width: 100%;
        margin: 0;
        padding: 0;
        border: 0;
        outline: 0;
        resize: none;
        overflow: hidden;
        background: transparent;
        color: inherit;
        font: inherit;
        line-height: 1.5;
      }
      textarea.src.h1 {
        font-size: 2em;
        font-weight: 700;
        line-height: 1.2;
        color: var(--h1);
      }
      textarea.src.h2 {
        font-size: 1.5em;
        font-weight: 700;
        line-height: 1.3;
        color: var(--h2);
      }
      textarea.src.h3 {
        font-size: 1.25em;
        font-weight: 700;
        color: var(--h3);
      }
      textarea.src.mono {
        font-family: var(--mono);
        font-size: 0.875em;
      }
      .tail {
        min-height: 25vh;
        cursor: text;
      }
      #blocks:empty + .tail::before {
        content: "Click here to start writing";
        color: var(--faint);
      }
      .file {
        padding-top: 24px;
      }
      .file img {
        max-width: 100%;
      }
      .children {
        padding-left: 1.4em;
      }

      /* ---- dialogs, menus, messages ---- */
      .backdrop {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(15, 15, 15, 0.45);
      }
      .backdrop.clear {
        background: transparent;
      }
      .dlg {
        position: fixed;
        z-index: 21;
        top: 18vh;
        left: 50%;
        transform: translateX(-50%);
        width: min(480px, calc(100vw - 32px));
        background: var(--bg);
        border-radius: 10px;
        box-shadow: var(--shadow);
        padding: 18px;
      }
      .dlg label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .dlg p {
        margin: 0 0 6px;
      }
      #dlg-input {
        width: 100%;
        font: inherit;
        color: inherit;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px 10px;
        outline: 0;
      }
      #dlg-input:focus {
        border-color: var(--accent);
      }
      .dlg.search {
        padding: 8px;
      }
      .dlg.search #dlg-input {
        border: 0;
        font-size: 17px;
      }
      #dlg-results {
        max-height: 50vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        border-top: 1px solid var(--line);
        margin-top: 6px;
        padding-top: 6px;
      }
      .result {
        border: 0;
        border-radius: 5px;
        text-align: left;
        padding: 7px 10px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .result.sel {
        background: var(--active);
      }
      .menu {
        position: fixed;
        z-index: 21;
        min-width: 200px;
        background: var(--bg);
        border-radius: 8px;
        box-shadow: var(--shadow);
        padding: 4px;
        display: flex;
        flex-direction: column;
      }
      .menu > button,
      .menu-row {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 0;
        text-align: left;
        padding: 6px 10px;
        font-size: 14px;
      }
      .menu .icon {
        width: 16px;
        height: 16px;
        flex: none;
        color: var(--muted);
      }
      .menu-row {
        border-top: 1px solid var(--line);
        margin-top: 4px;
        padding-top: 8px;
      }
      .menu-row > span:first-of-type {
        flex: 1;
      }
      .seg {
        display: flex;
        gap: 2px;
        padding: 2px;
        border-radius: 6px;
        background: var(--hover);
      }
      .seg-btn {
        border: 0;
        border-radius: 4px;
        padding: 4px 6px;
        line-height: 0;
      }
      .seg-btn.on {
        background: var(--bg);
        box-shadow: 0 0 0 1px var(--line);
      }
      .seg-btn.on .icon {
        color: var(--accent);
      }
      #toast {
        position: fixed;
        z-index: 30;
        left: 50%;
        bottom: calc(24px + env(safe-area-inset-bottom));
        transform: translate(-50%, 20px);
        max-width: calc(100vw - 32px);
        background: var(--toast);
        color: #fff;
        border-radius: 8px;
        padding: 9px 14px;
        font-size: 14px;
        box-shadow: var(--shadow);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.15s,
          transform 0.15s;
      }
      #toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      #toast.err {
        background: var(--danger);
      }

      /* ---- phones: the sidebar is a drawer ---- */
      @media (max-width: 759px) {
        #side {
          position: fixed;
          z-index: 10;
          top: 0;
          bottom: 0;
          left: 0;
          width: min(300px, 85vw);
          padding-top: calc(6px + env(safe-area-inset-top));
          margin-left: 0;
          transform: translateX(-100%);
          transition: transform 0.2s ease;
        }
        .nb.side-open #side {
          transform: none;
          box-shadow: var(--shadow);
        }
        .nb.side-open #scrim {
          display: block;
          position: fixed;
          inset: 0;
          z-index: 9;
          background: rgba(15, 15, 15, 0.45);
        }
        .show-side,
        .nb.side-closed .show-side {
          display: block;
        }
        .tools {
          display: flex;
        }
        .row {
          min-height: 38px;
        }
        #page {
          padding: 12px 16px calc(40vh + env(safe-area-inset-bottom));
        }
        .bar {
          padding: 0 8px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
