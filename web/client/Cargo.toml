[package]
name = "gition-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
console_error_panic_hook = "0.1.7"
gition = { path = "../..", default-features = false }
js-sys = "0.3"
ratatui-textarea = { version = "0.9.4", default-features = false }
ratzilla = "0.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha1_smol = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "BeforeUnloadEvent",
    "console",
    "CssStyleDeclaration",
    "Clipboard",
    "ClipboardEvent",
    "DataTransfer",
    "Element",
    "DomRect",
    "Document",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FontFaceSet",
    "Headers",
    "History",
    "HtmlElement",
    "HtmlTextAreaElement",
    "HtmlInputElement",
    "InputEvent",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MouseEvent",
    "Navigator",
    "Node",
    "PointerEvent",
    "Request",
    "RequestCache",
    "RequestInit",
    "Response",
    "Storage",
    "VisualViewport",
    "Window",
    "WheelEvent",
] }
