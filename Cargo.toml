[package]
name = "gition"
version = "0.2.2"
edition = "2024"
description = "A Notion-style notebook for the terminal, stored as markdown in git"
license = "MIT"
readme = "README.md"
repository = "https://github.com/berkslv/gition"
homepage = "https://github.com/berkslv/gition"
authors = ["Berk Selvi <berkslv@gmail.com>"]
exclude = ["/.github", "/tests/snapshots", "/web"]
keywords = ["notes", "markdown", "tui", "git", "notion"]
categories = ["command-line-utilities"]

[features]
default = ["native"]
# Terminal frontend, git CLI backend, page titles over HTTP and WebP image compression.
# The web build turns this off.
native = ["dep:crossterm", "dep:image", "dep:open", "dep:ratatui-image", "dep:ureq", "dep:webp", "ratatui/crossterm", "ratatui-textarea/crossterm"]

[[bin]]
name = "gition"
required-features = ["native"]

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29.0", optional = true }
image = { version = "0.25.10", optional = true }
nucleo-matcher = "0.3.1"
open = { version = "5.4.5", optional = true }
pulldown-cmark = "0.13.6"
ratatui = { version = "0.30.2", default-features = false, features = ["std", "layout-cache"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["image-defaults", "crossterm"], optional = true }
ratatui-textarea = { version = "0.9.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
unicode-width = "0.2"
ureq = { version = "3.5.1", optional = true }
web-time = "1.1"
webp = { version = "0.3.1", default-features = false, optional = true }

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Image decoding and WebP encoding are unusably slow unoptimized; keep dependencies fast in dev builds.
[profile.dev.package."*"]
opt-level = 2
