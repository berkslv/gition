[package]
name = "gition"
version = "0.1.0"
edition = "2024"
description = "A Notion-style notebook for the terminal, stored as markdown in git"
license = "MIT"
readme = "README.md"
repository = "https://github.com/berkslv/gition"
homepage = "https://github.com/berkslv/gition"
authors = ["Berk Selvi <berkslv@gmail.com>"]
exclude = ["/.github", "/tests/snapshots"]
keywords = ["notes", "markdown", "tui", "git", "notion"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
image = "0.25.10"
nucleo-matcher = "0.3.1"
open = "5.4.5"
pulldown-cmark = "0.13.6"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["image-defaults", "crossterm"] }
ratatui-textarea = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
unicode-width = "0.2"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"
